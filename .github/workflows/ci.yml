name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Install Stylua
              run: cargo install stylua --version 2.5.2 --locked
            - name: Run lint checks
              run: scripts/ci/lint.sh
            - name: Validate workflow syntax
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    test:
        name: test (${{ matrix.neovim }})
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                neovim: ['v0.11.5', 'stable', 'nightly']
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
              with:
                  neovim: true
                  version: ${{ matrix.neovim }}
            - name: Run tests
              run: scripts/ci/test.sh
            - name: Run clean-install smoke
              run: scripts/ci/install-smoke.sh
            - name: Require the experimental rendering API
              if: matrix.neovim == 'nightly'
              run: nvim --headless -u NONE -i NONE -c "lua assert(type(vim.api.nvim__ns_set) == 'function')" -c 'qa!'
